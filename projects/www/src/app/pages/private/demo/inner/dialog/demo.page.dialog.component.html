<section>
  <div class="actions">
    <button (click)="dialogScreenRef.open()">open {{positionType.SCREEN}}</button>
    <button (click)="dialogLateralRef.open()">open {{positionType.RIGHT}}</button>
    <button (click)="dialogCenitalRef.open()">open {{positionType.CENITAL}}</button>
    <button (click)="dialogNadirRef.open()">open {{positionType.NADIR}}</button>
    <button (click)="dialogLeftRef.open()">open {{positionType.LEFT}}</button>
    <button (click)="dialogCenterRef.open()">open {{positionType.CENTER}}</button>
    <button (click)="dialogRightNestedParentRef.open()">open nested</button>
    <button (click)="openInjectedDialog()">open injected dialog</button>
  </div>
</section>
<!--  -->
<ng-template #dialogInjected></ng-template>`
<!--  -->
<lib-ui-dialog #dialogScreenRef [layout]="layoutType.FULL" [position]="positionType.SCREEN">
  <div class="modal-body content">
    <div header class="modal-header">
      <button (click)="dialogScreenRef.close()">close</button>
    </div>
    <div>
      <app-dummy-content />
    </div>
    <div footer>Soy footer</div>
  </div>
</lib-ui-dialog>

<lib-ui-dialog #dialogRightNestedParentRef style="--ext-ui-dialog-lateral-max-width: 800px" [layout]="layoutType.FULL" [position]="positionType.RIGHT">
  <div class="modal-body content">
    <div header class="modal-header">
      <button (click)="dialogRightNestedParentRef.close()">close</button>
    </div>
    <div>
      <h3>I'm Parent</h3>
      <app-dummy-content />
      <button (click)="dialogRightNestedChildRef.open()">open child</button>
    </div>
    <div footer>Soy footer</div>
  </div>
</lib-ui-dialog>
