<dialog #dialogRef class="{{ 'from-'+position() }}"
  [style.--ui-dialog-transition-display-duration]="time()+'ms'">
  @if (isInjected()) {
    <ng-container #injectionComponentRef></ng-container>
  } @else {
    @if (layout() === layoutType.FULL) {
      <ng-container [ngTemplateOutlet]="fullLayout" />
     }
     @else {
       <ng-container [ngTemplateOutlet]="defaultLayout" />
     }
  }
</dialog>

<!-- default layout -->
<ng-template #defaultLayout>
  <ng-container [ngTemplateOutlet]="portal" />
</ng-template>

<!-- full layout -->
<ng-template #fullLayout>
  <ng-content select="[header]"></ng-content>
  <ng-container [ngTemplateOutlet]="portal" />
  <ng-content select="[footer]"></ng-content>
</ng-template>

<!-- default content -->
<ng-template #portal >
  <ng-content />
</ng-template>
